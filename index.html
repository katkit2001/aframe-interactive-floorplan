<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Διαδραστική Κάτοψη Έξυπνου Σπιτιού — A-Frame</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
</head>
<body>

  <a-scene renderer="preserveDrawingBuffer: true">
    <a-assets></a-assets>

    <a-sky color="#dbe9f4"></a-sky>
    <a-plane position="0 -0.02 0" rotation="-90 0 0" width="40" height="40" color="#7c9473"></a-plane>

    <a-light type="ambient" color="#f5f2ea" intensity="0.55"></a-light>
    <a-light type="directional" color="#fff4e0" intensity="0.5" position="4 8 4"></a-light>

    <a-entity id="walls"></a-entity>
    <a-entity id="floors"></a-entity>
    <a-entity id="entities"></a-entity>

    <a-entity camera look-controls="pointerLockEnabled: false" wasd-controls="acceleration: 25" position="-3 1.6 7">
      <a-entity cursor="fuse: false"
                position="0 0 -1"
                geometry="primitive: ring; radiusInner: 0.006; radiusOuter: 0.01"
                material="color: white; shader: flat"
                raycaster="objects: .clickable; far: 25"></a-entity>
    </a-entity>
  </a-scene>

  <!-- Οδηγίες χρήσης -->
  <div id="instructions" class="overlay">
    <div class="overlay-card">
      <h1>Διαδραστική Κάτοψη Έξυπνου Σπιτιού</h1>
      <p>Περιηγηθείτε στο σπίτι και κάντε κλικ σε φώτα, συσκευές, πόρτες και παράθυρα για να δείτε και να αλλάξετε την κατάστασή τους.</p>
      <ul>
        <li><strong>W A S D</strong> — μετακίνηση</li>
        <li><strong>Σύρσιμο ποντικιού</strong> — περιστροφή θέασης</li>
        <li><strong>Κλικ</strong> σε αντικείμενο — αλλαγή κατάστασης / πληροφορίες</li>
      </ul>
      <button id="start-btn">Είσοδος</button>
    </div>
  </div>

  <button id="help-btn" title="Οδηγίες">?</button>

  <!-- Info panel -->
  <div id="info-panel">
    <button id="info-close" title="Κλείσιμο">✕</button>
    <h2 id="info-title"></h2>
    <div id="info-body"></div>
  </div>

  <script src="js/layout.js"></script>
  <script src="js/entities.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
